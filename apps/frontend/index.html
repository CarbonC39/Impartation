<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Virtual Workspace</title>
  </head>
  <body>
    <div id="app-shell">
      <header class="masthead" id="masthead">
        <a class="brand" href="#" aria-label="Virtual Workspace 首页"><span aria-hidden="true">✿</span> Virtual Workspace</a>
        <label class="theme-picker" for="theme">配色<select id="theme" aria-label="选择界面配色">
          <option value="meadow">🍓 薄荷</option><option value="ocean">🐳 海蓝</option><option value="sunset">🍊 蜜桃</option><option value="lavender">🍇 葡萄</option>
        </select></label>
      </header>

      <main>
        <section class="flow-screen active" id="login-screen" aria-labelledby="login-title">
          <div class="flow-card login-card">
            <h1 id="login-title">账号登录</h1>
            <form id="login-form" class="stack-form">
              <label>账号<input id="account" type="email" autocomplete="username" placeholder="邮箱" required /></label>
              <label>密码<input id="password" type="password" autocomplete="current-password" placeholder="密码" required /></label>
              <button type="submit" class="primary wide">登录</button>
            </form>
          </div>
        </section>

        <section class="flow-screen" id="world-screen" aria-labelledby="world-title" hidden>
          <div class="flow-card wide-card">
            <div class="step-label"><span>1 / 3</span></div>
            <h1 id="world-title">选择世界</h1>
            <div class="world-grid" id="world-list">
              <button class="world-tile" type="button" data-world="sunny-lobby"><span class="world-art">🌼</span><span class="world-title">阳光大厅</span><span class="world-join">加入</span></button>
              <button class="world-tile" type="button" data-world="cloud-garden"><span class="world-art blue">☁️</span><span class="world-title">云朵花园</span><span class="world-join">加入</span></button>
              <div class="world-tile create-tile"><span class="world-art peach">🪄</span><span class="world-title">创建世界</span><form id="create-world-form"><label class="visually-hidden" for="world-name">世界名称</label><input id="world-name" maxlength="32" placeholder="世界名称" required /><button class="secondary" type="submit">创建</button></form></div>
            </div>
            <button class="text-button" type="button" data-back="login-screen">返回</button>
          </div>
        </section>

        <section class="flow-screen" id="avatar-screen" aria-labelledby="avatar-title" hidden>
          <div class="flow-card wide-card avatar-card">
            <div class="step-label"><span>2 / 3</span><span id="chosen-world-label">阳光大厅</span></div>
            <h1 id="avatar-title">选择人物</h1>
            <form id="avatar-form" class="avatar-form">
              <div class="avatar-preview" id="avatar-preview" aria-hidden="true">🌱</div>
              <label class="name-field">昵称<input id="name" maxlength="24" value="小访客" placeholder="昵称" required /></label>
              <fieldset class="avatar-options"><legend>选择人物</legend>
                <label class="avatar-choice"><input type="radio" name="avatar" value="mint" checked /><span class="avatar-face mint-face">🌱</span><span>薄荷芽</span></label>
                <label class="avatar-choice"><input type="radio" name="avatar" value="amber" /><span class="avatar-face amber-face">🐤</span><span>小黄鸭</span></label>
                <label class="avatar-choice"><input type="radio" name="avatar" value="violet" /><span class="avatar-face violet-face">🐱</span><span>紫耳猫</span></label>
              </fieldset>
              <div class="avatar-actions"><button class="secondary" type="button" data-back="world-screen">返回</button><button class="primary" type="submit">进入</button></div>
            </form>
          </div>
        </section>

        <section class="flow-screen map-screen" id="map-screen" aria-label="全屏世界地图" hidden>
          <div class="map-topbar"><button id="map-back" class="map-back" type="button"><span>退出</span></button><div><strong id="map-world-name">阳光大厅</strong><span id="status" role="status" aria-live="polite">连接中…</span></div><span class="map-help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span></div>
          <div id="map-layout"><div class="map-stage"><div id="game" aria-label="空间地图，使用 WASD 或方向键移动"><div class="empty-room"><span aria-hidden="true">🗺️</span><p>正在打开小世界…</p></div></div><p id="zone" role="status">当前区域：无</p></div>
            <aside class="chat-card" aria-label="聊天"><div class="chat-heading"><span class="chat-icon" aria-hidden="true">💬</span><div><h2>聊天</h2></div></div><ol id="messages" role="log" aria-live="polite" aria-label="聊天消息"></ol><form id="chat-form"><label for="message">消息</label><div class="compose"><input id="message" maxlength="500" autocomplete="off" placeholder="消息" required disabled /><button id="send" type="submit" disabled>发送</button></div></form></aside>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
