<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virtual Workspace · 开发验证</title>
  </head>
  <body>
    <main>
      <h1>Virtual Workspace</h1>
      <p>开发验证：访客联机、Tiled 地图与文字聊天。账号功能稍后接入。</p>
      <form id="join-form">
        <label>昵称 <input id="name" maxlength="24" value="访客" required /></label>
        <label>外观 <select id="avatar"><option value="mint">薄荷</option><option value="amber">琥珀</option><option value="violet">紫罗兰</option></select></label>
        <button id="join" type="submit">进入空间</button>
        <button id="leave" type="button" disabled>离开</button>
      </form>
      <p id="status" role="status" aria-live="polite">尚未连接</p>
      <div id="game" aria-label="空间地图，使用 WASD 或方向键移动"></div>
      <p>WASD / 方向键移动；输入文字时暂停移动。彩色区域是未来功能的触发点。</p>
      <p id="zone" role="status">当前区域：无</p>
      <section aria-label="房间聊天">
        <h2>房间聊天</h2>
        <ol id="messages" role="log" aria-live="polite"></ol>
        <form id="chat-form">
          <label>消息 <input id="message" maxlength="500" autocomplete="off" required disabled /></label>
          <button id="send" type="submit" disabled>发送</button>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
