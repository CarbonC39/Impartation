<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Virtual Workspace</title>
  </head>
  <body>
    <div id="app-shell">
      <header class="masthead" id="masthead">
        <a class="brand" href="#" aria-label="Virtual Workspace 首页"><svg class="brand-icon pixel-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 1h6v5h4v4h4v6h-5v4h-4v3h-4v-4H6v-4H1V9h4V5h4z"/><path fill="#fff7c5" d="M10 8h4v3h3v4h-4v3h-4v-3H6v-4h4z"/><rect x="11" y="11" width="3" height="3" fill="#ff7f9f"/></svg> Virtual Workspace</a>
        <label class="theme-picker" for="theme">配色<select id="theme" aria-label="选择界面配色">
          <option value="meadow">薄荷</option><option value="ocean">海蓝</option><option value="sunset">蜜桃</option><option value="lavender">葡萄</option>
        </select></label>
      </header>

      <main>
        <section class="flow-screen active" id="login-screen" aria-labelledby="login-title">
          <div class="flow-card login-card">
            <h1 id="login-title">账号登录</h1>
            <form id="login-form" class="stack-form">
              <label>账号<input id="account" type="text" autocomplete="username" placeholder="账号" required /></label>
              <label>密码<input id="password" type="password" autocomplete="current-password" placeholder="密码" required /></label>
              <button type="submit" class="primary wide" data-key="START" aria-label="登录">登录</button>
            </form>
            <details class="identity-options"><summary>跨设备身份</summary><p id="identity-status">身份未载入</p><form id="identity-form"><label>绑定码<input id="identity-code" maxlength="32" autocomplete="off" required /></label><button id="identity-export" type="button" disabled>生成绑定码</button><button id="identity-import" type="submit">绑定</button></form><p id="identity-feedback" role="status"></p></details>
          </div>
        </section>

        <section class="flow-screen" id="world-screen" aria-labelledby="world-title" hidden>
          <div class="flow-card wide-card">
            <div class="step-label"><span>1 / 3</span></div>
            <h1 id="world-title">选择世界</h1>
            <div class="world-grid" id="world-list">
              <button class="world-tile" type="button" data-world="sunny-lobby"><span class="world-art"><svg class="world-icon pixel-svg" viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#a9e7c2"/><path fill="#fff2bd" d="M0 69h160v31H0z"/><path fill="#81c99d" d="M0 61h160v8H0zM16 46h16v15H16zM32 38h16v23H32zM48 47h16v14H48zM109 35h16v26h-16zM125 44h17v17h-17z"/><path fill="#df9c67" d="M70 54h26v30H70z"/><path fill="#8b5e49" d="M74 59h7v8h-7zM86 59h7v8h-7z"/><path fill="#fff2bd" d="M60 85h47v5H60z"/><rect x="12" y="75" width="9" height="14" fill="#438766"/><rect x="138" y="72" width="9" height="17" fill="#438766"/><rect x="9" y="69" width="16" height="7" fill="#ff8ca7"/><rect x="135" y="66" width="16" height="7" fill="#ff8ca7"/></svg></span><span class="world-title">阳光大厅</span><span class="world-join">加入</span></button>
              <button class="world-tile" type="button" data-world="cloud-garden"><span class="world-art blue"><svg class="world-icon pixel-svg" viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#bceaff"/><path fill="#fff9e8" d="M0 69h160v31H0z"/><path fill="#ffffff" d="M28 24h18v-8h27v8h9v20H28zM92 38h14v-8h20v8h12v16H92z"/><path fill="#9fe1b8" d="M0 61h160v8H0zM22 56h7v-9h7v9h7v13H22zM116 58h7v-12h8v12h7v11h-22z"/><path fill="#a67257" d="M67 56h25v29H67z"/><path fill="#4d665d" d="M72 62h5v6h-5zM83 62h5v6h-5z"/><path fill="#ffb7c4" d="M75 73h9v4h-9z"/></svg></span><span class="world-title">云朵花园</span><span class="world-join">加入</span></button>
              <div class="world-tile create-tile"><span class="world-art peach"><svg class="world-icon pixel-svg" viewBox="0 0 160 100" aria-hidden="true"><rect width="160" height="100" fill="#ffe0c2"/><path fill="#fff8e8" d="M0 70h160v30H0z"/><path fill="#e4a779" d="M35 45h90v25H35zM45 35h70v10H45z"/><path fill="#ffcd68" d="M55 53h19v17H55zM86 53h19v17H86z"/><path fill="#fff3bc" d="M60 57h8v9h-8zM91 57h8v9h-8z"/><path fill="#896449" d="M75 48h10v22H75z"/><path fill="#8bc89c" d="M18 63h8V48h8v15h7v7H18zM122 63h8V48h8v15h7v7h-23z"/></svg></span><span class="world-title">创建世界</span><form id="create-world-form"><label class="visually-hidden" for="world-name">世界名称</label><input id="world-name" maxlength="32" placeholder="世界名称" required /><button class="secondary" type="submit" data-key="A" aria-label="创建">创建</button></form></div>
            </div>
            <button class="text-button" type="button" data-back="login-screen">返回</button>
          </div>
        </section>

        <section class="flow-screen" id="avatar-screen" aria-labelledby="avatar-title" hidden>
          <div class="flow-card wide-card avatar-card">
            <div class="step-label"><span>2 / 3</span><span id="chosen-world-label">阳光大厅</span></div>
            <h1 id="avatar-title">选择人物</h1>
            <form id="join-form" class="avatar-form">
              <div class="avatar-preview" id="avatar-preview" aria-hidden="true"><svg class="avatar-sprite pixel-svg" viewBox="0 0 48 48"><rect x="17" y="4" width="14" height="6" fill="#54aa72"/><rect x="11" y="10" width="26" height="8" fill="#73d796"/><rect x="7" y="18" width="34" height="19" fill="#73d796"/><rect x="13" y="24" width="5" height="5" fill="#354b45"/><rect x="30" y="24" width="5" height="5" fill="#354b45"/><rect x="17" y="32" width="14" height="4" fill="#fff4d2"/><rect x="11" y="37" width="8" height="7" fill="#54aa72"/><rect x="29" y="37" width="8" height="7" fill="#54aa72"/></svg></div>
              <label class="name-field">昵称<input id="name" maxlength="24" value="小访客" placeholder="昵称" required /></label>
              <fieldset class="avatar-options"><legend class="visually-hidden">选择人物</legend>
                <label class="avatar-choice"><input type="radio" name="avatar-choice" value="mint" checked /><span class="avatar-face mint-face"><svg class="avatar-sprite pixel-svg" viewBox="0 0 48 48" aria-hidden="true"><rect x="17" y="4" width="14" height="6" fill="#54aa72"/><rect x="11" y="10" width="26" height="8" fill="#73d796"/><rect x="7" y="18" width="34" height="19" fill="#73d796"/><rect x="13" y="24" width="5" height="5" fill="#354b45"/><rect x="30" y="24" width="5" height="5" fill="#354b45"/><rect x="17" y="32" width="14" height="4" fill="#fff4d2"/><rect x="11" y="37" width="8" height="7" fill="#54aa72"/><rect x="29" y="37" width="8" height="7" fill="#54aa72"/></svg></span><span>薄荷芽</span></label>
                <label class="avatar-choice"><input type="radio" name="avatar-choice" value="amber" /><span class="avatar-face amber-face"><svg class="avatar-sprite pixel-svg" viewBox="0 0 48 48" aria-hidden="true"><rect x="14" y="7" width="20" height="7" fill="#d69935"/><rect x="8" y="14" width="32" height="22" fill="#ffd15e"/><rect x="14" y="22" width="5" height="5" fill="#354b45"/><rect x="29" y="22" width="5" height="5" fill="#354b45"/><rect x="20" y="29" width="8" height="5" fill="#f28b55"/><rect x="12" y="36" width="9" height="6" fill="#d69935"/><rect x="27" y="36" width="9" height="6" fill="#d69935"/></svg></span><span>小黄鸭</span></label>
                <label class="avatar-choice"><input type="radio" name="avatar-choice" value="violet" /><span class="avatar-face violet-face"><svg class="avatar-sprite pixel-svg" viewBox="0 0 48 48" aria-hidden="true"><path fill="#8c65b7" d="M7 22V5h12l5 8 5-8h12v17z"/><rect x="8" y="19" width="32" height="18" fill="#c69bee"/><rect x="14" y="24" width="5" height="5" fill="#354b45"/><rect x="29" y="24" width="5" height="5" fill="#354b45"/><rect x="19" y="31" width="10" height="4" fill="#fff4d2"/><rect x="12" y="37" width="9" height="6" fill="#8c65b7"/><rect x="27" y="37" width="9" height="6" fill="#8c65b7"/></svg></span><span>紫耳猫</span></label>
              </fieldset>
              <select id="avatar" class="visually-hidden" aria-hidden="true" tabindex="-1"><option value="mint">薄荷芽</option><option value="amber">小黄鸭</option><option value="violet">紫耳猫</option></select>
              <div class="avatar-actions"><button class="secondary" type="button" data-back="world-screen" data-key="B" aria-label="返回">返回</button><button id="join" class="primary" type="submit" data-key="A" aria-label="进入">进入</button></div>
            </form>
          </div>
        </section>

        <section class="flow-screen map-screen" id="map-screen" aria-label="全屏世界地图" hidden>
          <div class="map-topbar"><button id="leave" class="map-back" type="button" data-key="B" aria-label="退出"><span>退出</span></button><div><strong id="map-world-name">阳光大厅</strong><span id="status" role="status" aria-live="polite">连接中…</span></div><span class="map-help"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span></div>
          <div id="map-layout"><div class="map-stage"><div id="game" aria-label="空间地图，使用 WASD 或方向键移动"><div class="empty-room"><svg class="empty-map-icon pixel-svg" viewBox="0 0 48 48" aria-hidden="true"><path fill="#80c998" d="M4 12 17 6l14 6 13-6v30l-13 6-14-6-13 6z"/><path fill="#fff4d2" d="m17 6 14 6v30l-14-6z"/><path fill="#548465" d="m4 12 13 6v24L4 36zM31 12l13-6v30l-13 6z"/><rect x="21" y="17" width="5" height="5" fill="#ff7f9f"/><rect x="20" y="22" width="7" height="10" fill="#ff7f9f"/><rect x="18" y="26" width="3" height="5" fill="#354b45"/><rect x="26" y="26" width="3" height="5" fill="#354b45"/></svg><p>加载地图中…</p></div></div><p id="zone" role="status">当前区域：无</p></div>
            <aside class="chat-card" aria-label="聊天"><div class="chat-heading"><svg class="chat-icon pixel-svg" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 3h20v14h-8l-5 5v-5H2z"/><rect x="6" y="8" width="3" height="3" fill="#fff9df"/><rect x="11" y="8" width="3" height="3" fill="#fff9df"/><rect x="16" y="8" width="3" height="3" fill="#fff9df"/></svg><h2>聊天</h2></div><ol id="messages" role="log" aria-live="polite" aria-label="聊天消息"></ol><form id="chat-form"><label for="message">消息</label><div class="compose"><input id="message" maxlength="500" autocomplete="off" placeholder="消息" required disabled /><button id="send" type="submit" disabled data-key="A" aria-label="发送">发送</button></div></form></aside>
            <div class="touch-controls" aria-label="方向键"><button type="button" class="touch-key touch-up" data-move="up" aria-label="向上"><svg class="pixel-svg" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 1h4v4h4v4h-4v6H6V9H2V5h4z"/></svg></button><button type="button" class="touch-key touch-left" data-move="left" aria-label="向左"><svg class="pixel-svg" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 1h4v4h4v4h-4v6H6V9H2V5h4z"/></svg></button><span class="touch-key touch-center" aria-hidden="true"></span><button type="button" class="touch-key touch-right" data-move="right" aria-label="向右"><svg class="pixel-svg" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 1h4v4h4v4h-4v6H6V9H2V5h4z"/></svg></button><button type="button" class="touch-key touch-down" data-move="down" aria-label="向下"><svg class="pixel-svg" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M6 1h4v4h4v4h-4v6H6V9H2V5h4z"/></svg></button></div>
          </div>
          <div id="interaction-panels">
            <section id="tool-panel" class="feature-panel" aria-labelledby="tool-heading" hidden><h2 id="tool-heading">外部工具</h2><p id="tool-status" role="status"></p><a id="tool-open" target="_blank" rel="noopener noreferrer" hidden>打开工具</a></section>
            <section id="board-panel" class="feature-panel" aria-labelledby="board-heading" hidden><h2 id="board-heading">留言板 <small id="board-count">0 / 100 条</small></h2><p>留言会保存在房间中。</p><ol id="board-notes" aria-label="已发布留言"></ol><form id="board-form"><label for="board-text">留言</label><textarea id="board-text" maxlength="500" rows="3" required></textarea><button id="board-post" type="submit">发布</button></form></section>
            <section id="pomodoro-panel" class="feature-panel" aria-labelledby="pomodoro-heading" hidden><h2 id="pomodoro-heading">共享计时</h2><p id="pomodoro-status" role="status">准备开始</p><output id="pomodoro-time" aria-label="剩余时间">25:00</output><div class="timer-controls"><label>模式<select id="pomodoro-mode"><option value="focus">专注 · 25 分钟</option><option value="break">休息 · 5 分钟</option></select></label><button id="pomodoro-start" type="button">开始</button><button id="pomodoro-pause" type="button" disabled>暂停</button><button id="pomodoro-resume" type="button" disabled>继续</button><button id="pomodoro-reset" type="button">重置</button></div></section>
            <p id="feature-status" role="status" aria-live="polite"></p>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
