  # wbo:
  #   image: lovasoa/wbo:latest
  #   restart: unless-stopped
  #   environment:
  #     WBO_BASE_PATH: /board
  #     WBO_IP_SOURCE: X-Forwarded-For
  #   volumes:
  #     - wbo_data:/opt/app/server-data

  # Want a shared browser? Uncomment Neko, the Neko Caddyfile route,
